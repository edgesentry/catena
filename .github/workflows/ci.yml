name: catena-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.filter.outputs.apps }}
      pipeline: ${{ steps.filter.outputs.pipeline }}
      integration: ${{ steps.filter.outputs.integration }}
      contracts: ${{ steps.filter.outputs.contracts }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [[ -z "${base}" || "${base}" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi

          changed="$(git diff --name-only "${base}" "${GITHUB_SHA}")"
          echo "changed files:"
          echo "${changed}"

          has_match() {
            local pattern="$1"
            if echo "${changed}" | grep -Eq "${pattern}"; then
              echo "true"
            else
              echo "false"
            fi
          }

          echo "apps=$(has_match '^apps/')" >> "${GITHUB_OUTPUT}"
          echo "pipeline=$(has_match '^(pipeline/|agents/|tests/|fixtures/|profiles/|rules/|scripts/generate_maritime|pyproject\.toml|uv\.lock)')" >> "${GITHUB_OUTPUT}"
          echo "integration=$(has_match '^(pipeline/|agents/|contracts/|shared/)')" >> "${GITHUB_OUTPUT}"
          echo "contracts=$(has_match '^contracts/')" >> "${GITHUB_OUTPUT}"
          echo "shared=$(has_match '^shared/')" >> "${GITHUB_OUTPUT}"

  contracts-check:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.contracts == 'true' || needs.detect-changes.outputs.shared == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contract validation and determinism tests
        run: ./tools/scripts/test-contracts.sh

  pipeline-check:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.pipeline == 'true' || needs.detect-changes.outputs.contracts == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pipeline and agent unit tests
        run: ./tools/scripts/test-pipeline.sh

  integration-check:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.integration == 'true' || needs.detect-changes.outputs.contracts == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: edgesentry/edgesentry-rs
          path: edgesentry-rs
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Catena boundary tests (eval manifest ↔ eds CLI)
        env:
          CATENA_EDGESENTRY_RS: ${{ github.workspace }}/edgesentry-rs
          EDS_BIN: ${{ github.workspace }}/edgesentry-rs/target/debug/eds
        run: ./tools/scripts/test-integration.sh

  e2e-check:
    runs-on: ubuntu-latest
    needs: integration-check
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: edgesentry/edgesentry-rs
          path: edgesentry-rs
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Full clearance smoke (catena orchestration)
        env:
          CATENA_EDGESENTRY_RS: ${{ github.workspace }}/edgesentry-rs
          EDS_BIN: ${{ github.workspace }}/edgesentry-rs/target/debug/eds
        run: ./tools/scripts/test-e2e.sh vessel-hold

  apps-check:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.apps == 'true' || needs.detect-changes.outputs.contracts == 'true'
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/scripts/test-apps.sh
