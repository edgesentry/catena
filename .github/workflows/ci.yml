name: catena-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.filter.outputs.apps }}
      pipeline: ${{ steps.filter.outputs.pipeline }}
      contracts: ${{ steps.filter.outputs.contracts }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [[ -z "${base}" || "${base}" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi

          changed="$(git diff --name-only "${base}" "${GITHUB_SHA}")"
          echo "changed files:"
          echo "${changed}"

          has_match() {
            local pattern="$1"
            if echo "${changed}" | grep -Eq "${pattern}"; then
              echo "true"
            else
              echo "false"
            fi
          }

          echo "apps=$(has_match '^apps/')" >> "${GITHUB_OUTPUT}"
          echo "pipeline=$(has_match '^(pipeline/|agents/|tests/maritime_cyber/|fixtures/|profiles/|rules/|scripts/generate_maritime|pyproject\.toml|uv\.lock)')" >> "${GITHUB_OUTPUT}"
          echo "contracts=$(has_match '^contracts/')" >> "${GITHUB_OUTPUT}"
          echo "shared=$(has_match '^shared/')" >> "${GITHUB_OUTPUT}"

  validate-contracts:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.contracts == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Validate baseline contract schemas
        run: ./tools/scripts/validate-contracts.sh

  pipeline-check:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.pipeline == 'true' || needs.detect-changes.outputs.contracts == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test maritime_cyber pipeline
        run: |
          uv sync --extra test
          uv run pytest tests/maritime_cyber -q

  apps-check:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.apps == 'true' || needs.detect-changes.outputs.contracts == 'true'
    steps:
      - uses: actions/checkout@v4
      - run: 'echo "TODO Phase B: run apps checks"'
